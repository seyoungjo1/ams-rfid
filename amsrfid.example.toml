# Windows defaults to the isolated portable client and automatic port detection.
# Set true only to deliberately use an existing installation and the settings below.
use_system_client = false

# 이 파일을 amsrfid.toml 로 복사한 뒤 필요한 줄만 고치세요.
# 전부 생략해도 기본값으로 돕니다. (amsrfid.toml 은 git·자동업데이트에서 제외됩니다.)

# Proxmark3 클라이언트 경로. 비우면 PATH·ProxSpace 등 흔한 위치에서 알아서 찾습니다.
pm3_path = ""

# 장치관리자의 COM 포트(예: COM7). 지정하면 자동 포트 탐지를 건너뜁니다.
port = ""

# 덤프(.bin)와 pm3 가 떨군 키 파일을 저장할 폴더.
outdir = "out"

# 키 복구처럼 오래 걸리는 명령의 제한 시간(초).
timeout = 300

# 장치/카드를 기다릴 때 다시 확인하는 간격(초)과, 최대 몇 초까지 기다릴지.
poll = 1.5
wait = 120
