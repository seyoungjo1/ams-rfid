name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      refresh_library:
        description: "필라멘트 라이브러리를 최신으로 다시 생성"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 필라멘트 라이브러리를 얕게 클론해 index.json 을 최신으로 재생성한다.
      # 실패하더라도 저장소에 커밋된 index.json 을 그대로 사용한다.
      - name: Refresh filament library
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_library }}
        continue-on-error: true
        run: |
          set -e
          git clone --depth 1 https://github.com/queengooborg/Bambu-Lab-RFID-Library.git /tmp/lib
          python3 scripts/build_tag_library.py /tmp/lib app/src/main/assets/library/index.json --samples 6
          ls -la app/src/main/assets/library/

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass amsrfid -keypass amsrfid \
            -alias amsrfid -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ams-rfid, OU=community, O=ams-rfid, L=NA, ST=NA, C=NA"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: amsrfid
          KEY_ALIAS: amsrfid
          KEY_PASSWORD: amsrfid
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ams-rfid-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ams-rfid-debug.apk
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ams-rfid-apk
          path: dist/*.apk
          if-no-files-found: error

      # v* 태그 푸시면 그 태그로, 아니면 앱 versionName(v1.0.0 등) 태그로 릴리스를 만든다.
      # 이미 같은 버전 태그가 있으면 건너뛰므로, 새 릴리스는 versionName 을 올려서 낸다.
      - name: Determine release tag
        id: rel
        run: |
          VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VER" > /dev/null; then
            echo "v$VER 릴리스가 이미 있어 건너뜁니다. 새 릴리스는 versionName 을 올리세요."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 필라멘트 태그 도구 ${{ steps.rel.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
