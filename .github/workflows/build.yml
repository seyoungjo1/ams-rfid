name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      refresh_library:
        description: "필라멘트 라이브러리를 최신으로 다시 생성"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 필라멘트 라이브러리를 얕게 클론해 index.json 을 최신으로 재생성한다.
      # 실패하더라도 저장소에 커밋된 index.json 을 그대로 사용한다.
      - name: Refresh filament library
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_library }}
        continue-on-error: true
        run: |
          set -e
          git clone --depth 1 https://github.com/queengooborg/Bambu-Lab-RFID-Library.git /tmp/lib
          python3 scripts/build_tag_library.py /tmp/lib app/src/main/assets/library/index.json --samples 6
          ls -la app/src/main/assets/library/

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass amsrfid -keypass amsrfid \
            -alias amsrfid -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ams-rfid, OU=community, O=ams-rfid, L=NA, ST=NA, C=NA"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: amsrfid
          KEY_ALIAS: amsrfid
          KEY_PASSWORD: amsrfid
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ams-rfid-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ams-rfid-debug.apk
          ls -la dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ams-rfid-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
